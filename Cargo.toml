[workspace]
members = [
  "crates/domain",
  "crates/application",
  "crates/transport-http",
  "crates/test-support",
  "apps/api",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
