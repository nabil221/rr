services:
  postgres:
    image: postgres:18-alpine
    container_name: local-stack-proof-postgres
    environment:
      POSTGRES_USER: local_stack_proof
      POSTGRES_PASSWORD: local_stack_proof
      POSTGRES_DB: local_stack_proof
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - local_stack_proof_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U local_stack_proof -d local_stack_proof"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  local_stack_proof_postgres_data:
    name: local_stack_proof_postgres_data
